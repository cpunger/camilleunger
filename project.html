<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <style> 
    body {
      background-color: #111;
      color: #e0e0e0;
      font-family: monospace;
      margin: 0;
      padding: 0;
      background-image: url('images/background.jpg'); 
      background-size: 292px;
      background-repeat: repeat;
    }
    .container {
      max-width: 150px;
      margin: .5rem auto;
      background: rgba(0, 0, 0, 0.7);
      padding: .2rem;
      border: 1px dashed #6D6F8A;
    }
    
    a {
      color: #bbbbbb; 
      text-decoration: none; }
    a:hover {
      color: #bbbbbb; }
    .wrap { max-width: 760px; 
           margin: 2.5rem auto 4rem;
           padding: 0 1rem; }
    
    header { display: flex; 
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.25rem; }
    h2 {
      text-align: center; 
      color: #bbbbbb; }
    h3 {
      margin-bottom: 2rem;
      text-align: center; 
      color: #bbbbbb; }
    
    nav {
      display: flex;
      gap: 1.5rem;
      padding: .5rem;
      background: rgba(0, 0, 0, 0.6);
      justify-content: left; }
    nav a {
      color: #6D6F8A;
      text-decoration: none;
      font-weight: bold; }
    
    .controls { display: flex;
               flex-wrap: wrap; gap: .5rem .6rem;
               margin: 1rem 0 2rem; }

    article {
             max-width: 700px;
             margin: 2rem auto;
             background: rgba(0, 0, 0, 0.75);
             padding: 2rem;
             border: 1px dashed #6D6F8A;}
    article header { display: block;
                    margin: 0 0 .25rem; }
    article h2 { font-size: 1.25rem;
                margin: 0 0 .25rem; }
    
    summary { list-style: none; 
             cursor: pointer; }
    summary::-webkit-details-marker { display: none; }
    .summary-line { display: flex; 
                   align-items: center;
                   gap: .9rem; }
    .summary-line .read { font-size: .7rem;
                         color: #a540d2; }

    .teaser { margin: .35rem 0 .5rem;
             color: #e0e0e0; }
    .content { padding-top: .5rem; border-top: 1px dashed var(--border); }
    .content p { margin: .6rem 0; }
    .content img { width: 100%; 
                  height: auto;
                  border-radius: 12px; 
                  border: 1px solid var(--border); }
    /* small screens */
    @media (max-width: 560px) {
      header { flex-direction: column; align-items: flex-start; gap: .35rem; } }
  </style>
</head>
